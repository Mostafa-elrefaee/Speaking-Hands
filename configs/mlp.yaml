# mlp on the repo's own sequence dataset. Same data / head / training recipe as
# the other three (only the temporal encoder differs) -- that is what makes the
# comparison fair. Everything not listed = configs/default.yaml.
name: mlp
model:
  architecture: mlp
  mlp_hidden_layers: [128, 64]   # applied to the flattened 30 x 84 = 2520 vector
